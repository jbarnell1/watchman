# XcodeGen project for the iOS client. `xcodegen generate` writes Watchman.xcodeproj (not committed).
# Two targets: the app (pairing, partner codes, heartbeats) and the Safari web extension (the
# shared WebExtension from clients/extension, built first by CI), which blurs and reports (ADR-049).
name: Watchman
options:
  bundleIdPrefix: app.watchman
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  WatchmanCore:
    path: WatchmanCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Watchman:
    type: application
    platform: iOS
    sources: [Watchman]
    dependencies:
      - package: WatchmanCore
      - target: WatchmanSafari
    info:
      path: Watchman/Info.plist
      properties:
        CFBundleDisplayName: Watchman
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
    entitlements:
      path: Watchman/Watchman.entitlements
      properties:
        com.apple.security.application-groups: [group.app.watchman]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.watchman.ios

  WatchmanSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
      - path: ../extension/dist/firefox
        type: folder
        buildPhase: resources
    dependencies:
      - package: WatchmanCore
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Watchman
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.watchman.ios.safari

schemes:
  Watchman:
    build:
      targets:
        Watchman: all
    run:
      config: Debug
