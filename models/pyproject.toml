[project]
name = "watchman-models"
version = "0.1.0"
description = "Model manifest, fetch and export scripts, evaluation harness for Watchman"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
# Only needed to export the Marqo classifier from safetensors (fetch.py --export).
export = ["torch>=2.4", "timm>=1.0", "onnx>=1.16", "safetensors>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchman_models"]

[tool.ruff.lint.per-file-ignores]
"eval/screenshots.py" = ["E501"]   # the printed report lines read better unwrapped
