name: android

on:
  push:
    paths: ["clients/android/**", "models/test-vectors/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["clients/android/**", "models/test-vectors/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # One APK per CPU architecture: phones take arm64-v8a, about a third of the universal APK.
      - run: flutter build apk --debug --split-per-abi
      - run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: clients/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: watchman-android-debug
          path: clients/android/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
