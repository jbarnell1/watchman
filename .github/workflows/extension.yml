name: extension

on:
  push:
    paths: ["clients/extension/**", "models/test-vectors/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["clients/extension/**", "models/test-vectors/**", ".github/workflows/extension.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs --zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: clients/extension/dist/*.zip
