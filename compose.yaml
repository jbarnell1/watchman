# Watchman household server: one Tailscale node ("watchman" by default) with the server behind it.
# The server binds loopback inside the sidecar's network namespace, so the only way in is
# `tailscale serve` on :443, which adds the identity headers the portal trusts (ADR-006).
#
#   cp .env.example .env     # set TS_AUTHKEY
#   docker compose up -d
#   open https://watchman.<your-tailnet>.ts.net

services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: ${WATCHMAN_NODE_NAME:-watchman}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  server:
    build: ./server
    image: ghcr.io/jbarnell1/watchman-server:${WATCHMAN_VERSION:-latest}
    network_mode: service:tailscale
    environment:
      WATCHMAN_DATA_DIR: /data
      WATCHMAN_MODELS_DIR: /models
      WATCHMAN_BIND_HOST: 127.0.0.1
      WATCHMAN_BIND_PORT: ${WATCHMAN_PORT:-8030}
      WATCHMAN_TRUSTED_PROXIES: '["127.0.0.1", "::1"]'
    volumes:
      - ./data:/data
      - ./models/cache:/models:ro
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
