[project]
name = "watchman-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pillow>=10",
    "pydantic-settings>=2",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]   # FastAPI Depends() in defaults is the framework idiom

[project.scripts]
watchman-server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/devserver.py" = ["E501"]
